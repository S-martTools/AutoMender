profile: paper
strict: true
seed: 42
model:
  name: Qwen/Qwen2-7B-Instruct
  dtype: bfloat16
  device: auto
  sequence_length: 3072
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
cmoe: {rank: 8, alpha: 32.0, dropout: 0.1, lambda_comm: 1.0, conflict_alpha: 0.1}
dapt: {epochs: 1, learning_rate: 0.0002, effective_batch_size: 32, micro_batch_size: 1}
sft: {epochs: 3, learning_rate: 0.0002, effective_batch_size: 32, micro_batch_size: 1}
optimizer: {betas: [0.9, 0.999], eps: 1.0e-8, weight_decay: 0.0, warmup_ratio: 0.03, gradient_clip: 1.0}
ppo: {candidates: 4, clip: 0.2, gamma: 1.0, value_coefficient: 0.5, kl_coefficient: 0.01, entropy_coefficient: 0.01, epochs: 4, batch_size: 32, learning_rate: 0.00001}
quality: {lambda_old: 1.0, lambda_new: 1.0, lambda_change: 0.5, invalid_penalty: 10000.0, stopping_threshold: 5000.0, distance: dtw}
repair: {max_iterations: 3, max_new_tokens: 3072}
paths: {}
compiler: {executable: solc}
behavior:
  command: [symx-validate, --original, "{original}", --repaired, "{repaired}", --manifest, "{manifest}", --json]
  timeout: 600
detectors:
  weights: Detection_weights/default.yaml
  tools:
    SmartFast: {command: [smartfast, --json, "{contract}"], supported_types: [RE, SU, AS, REN, IO, UCL, UCS, TO, REE, TS, BP, ST, CNE, RR, UUS, EGL, COL, RDS, BE, AIB, CS, RTS, EF]}
    VulHunter: {command: [vulhunter, --json, "{contract}"], supported_types: [RE, SU, AS, TOD, IO, UCL, UCS, TO, TS, BP, ST, UUS, COL, BE, AIB, EF]}
    RSymX: {command: [rsymx, --json, "{contract}"], supported_types: [RE, SU, AS, TOD, IO, UCL, UCS, TO, TS, BP, ST, BE]}
    Slither: {command: [slither], supported_types: [RE, SU, AS, REN, UCL, UCS, TO, REE, TS, UUS, COL, RDS, BE, CS, EF]}
    Securify: {command: [securify, --json, "{contract}"], supported_types: [RE, SU, TOD, REN, UCL, UCS, TO, TS, UUS, CS, EF]}
    ILF: {command: [ilf, --json, "{contract}"], supported_types: [SU, AS, UCL, TS, BP]}
