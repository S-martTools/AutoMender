[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automender"
version = "0.2.0"
description = "Paper-grade AutoMender smart-contract repair artifact"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.1", "tqdm>=4.66.0", "numpy>=1.23.0"]

[project.optional-dependencies]
train = ["torch>=2.1", "transformers>=4.40", "accelerate>=0.29", "safetensors>=0.4"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
automender = "automender.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["automender*"]
